name: CI

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r tools/requirements-calibration.txt
      - run: python -m compileall -q tools ego_wilor/scripts
      - run: python tools/test_sync_core.py
      - run: python tools/test_spatial_calibration_core.py
